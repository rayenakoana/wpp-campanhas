<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — WPP Campanhas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E0E15; --surface:#13131C; --surface-2:#17171F; --line:#232330; --line-soft:#1B1B26;
    --red:#E8192C; --red-deep:#8a1520; --gold:#C9A017; --text:#EDEDF2; --text-2:#8F8FA3; --text-3:#5C5C70; --green:#3DBE7B; --amber:#D97E2B;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{font-size:15px;}
  body{
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh;
    display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(232,25,44,0.12), transparent 60%),
      radial-gradient(700px 460px at -10% 100%, rgba(201,160,23,0.06), transparent 60%),
      radial-gradient(560px 400px at 50% 115%, rgba(232,25,44,0.06), transparent 65%);
    animation:ambient 14s ease-in-out infinite alternate;
  }
  @keyframes ambient{
    0%{opacity:.75; transform:translateY(0);}
    100%{opacity:1; transform:translateY(-12px);}
  }
  @media (prefers-reduced-motion: reduce){ body::before{animation:none;} }

  h1,h2,h3{font-family:'Barlow Condensed',sans-serif; font-weight:600; letter-spacing:.02em; margin:0;}

  .login-card{
    position:relative; z-index:1; width:380px; padding:36px 34px 30px;
    background:linear-gradient(165deg, rgba(255,255,255,0.045) 0%, rgba(255,255,255,0.018) 100%);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.09); border-top-color:rgba(255,255,255,0.14);
    border-radius:18px; box-shadow:0 24px 60px rgba(0,0,0,0.45);
  }
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:28px; justify-content:center;}
  .brand-mark{width:32px;height:32px;border-radius:8px; background:linear-gradient(160deg, var(--red), var(--red-deep)); display:flex;align-items:center;justify-content:center; font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:15px; color:#fff;}
  .brand-name{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:19px;}

  h1.title{font-size:22px; text-align:center; margin-bottom:6px;}
  .subtitle{font-size:13px; color:var(--text-2); text-align:center; margin-bottom:28px;}

  label{display:block; font-size:12.5px; color:var(--text-2); margin-bottom:6px; font-weight:500;}
  .field{margin-bottom:16px;}
  input[type=email], input[type=password]{
    width:100%; padding:11px 13px; border-radius:9px; font-size:14px; font-family:'Inter';
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.09); color:var(--text);
    outline:none; transition:border-color .15s ease, background .15s ease;
  }
  input[type=email]:focus, input[type=password]:focus{
    border-color:var(--red); background:rgba(255,255,255,0.07);
  }
  input::placeholder{color:var(--text-3);}

  .row-between{display:flex; justify-content:space-between; align-items:center; margin:2px 0 22px;}
  .remember{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--text-2);}
  .remember input{accent-color:var(--red);}
  .forgot{font-size:12.5px; color:var(--gold); text-decoration:none;}
  .forgot:hover{text-decoration:underline;}

  .btn-primary{
    width:100%; padding:12px; border:none; border-radius:9px; font-family:'Inter'; font-weight:600; font-size:14px;
    color:#fff; background:linear-gradient(160deg, var(--red), var(--red-deep)); cursor:pointer;
    box-shadow:0 8px 24px rgba(232,25,44,0.28); transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn-primary:hover{ transform:translateY(-1px); box-shadow:0 12px 30px rgba(232,25,44,0.36); }
  .btn-primary:active{ transform:translateY(0); }

  .divider{display:flex; align-items:center; gap:12px; margin:22px 0; color:var(--text-3); font-size:12px;}
  .divider::before, .divider::after{content:''; flex:1; height:1px; background:rgba(255,255,255,0.09);}

  .btn-google{
    width:100%; padding:11px; border-radius:9px; font-family:'Inter'; font-weight:500; font-size:13.5px;
    color:var(--text); background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1);
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px;
    transition:background .15s ease, border-color .15s ease;
  }
  .btn-google:hover{ background:rgba(255,255,255,0.07); border-color:rgba(255,255,255,0.16); }
  .btn-google svg{width:16px; height:16px;}

  .footer-note{text-align:center; font-size:11.5px; color:var(--text-3); margin-top:24px;}
  .footer-note a{color:var(--text-2); text-decoration:none;}
  .footer-note a:hover{text-decoration:underline;}

  .error-msg{
    display:none; background:rgba(232,25,44,0.1); border:1px solid rgba(232,25,44,0.28); color:#f28c94;
    font-size:12.5px; padding:9px 12px; border-radius:8px; margin-bottom:16px;
  }
  .error-msg.show{display:block;}
</style>
</head>
<body>

<div class="login-card">
  <div class="brand">
    <span class="brand-mark">W</span>
    <span class="brand-name">WPP Campanhas</span>
  </div>

  <h1 class="title">Bem-vinda de volta</h1>
  <p class="subtitle">Entre com sua conta Costurando Sucesso</p>

  <div class="error-msg" id="errorMsg">E-mail ou senha incorretos. Tente novamente.</div>

  <form id="loginForm">
    <div class="field">
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="voce@costurandosucesso.com" required>
    </div>
    <div class="field">
      <label for="password">Senha</label>
      <input type="password" id="password" placeholder="••••••••" required>
    </div>

    <div class="row-between">
      <label class="remember"><input type="checkbox" checked> Lembrar de mim</label>
      <a href="#" class="forgot">Esqueceu a senha?</a>
    </div>

    <button type="submit" class="btn-primary">Entrar</button>
  </form>

  <div class="divider">ou</div>

  <button class="btn-google" id="googleBtn">
    <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Entrar com Google Workspace
  </button>

  <p class="footer-note">Precisa de acesso? Fale com um <a href="#">administrador</a>.</p>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  // Placeholder — integração real com Supabase Auth (projeto syecwttpsvrmhdvinjmt) entra aqui.
  // No protótipo, qualquer submit válido redireciona direto pro app.
  window.location.href = 'wpp-campanhas-app-v5.html';
});
document.getElementById('googleBtn').addEventListener('click', function(){
  // Placeholder — fluxo OAuth Google Workspace via Supabase Auth entra aqui
  window.location.href = 'wpp-campanhas-app-v5.html';
});
</script>

</body>
</html>
