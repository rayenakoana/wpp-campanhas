server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Necessario para React Router: qualquer rota que nao seja um arquivo
    # existente cai de volta no index.html, deixando o roteamento
    # client-side (react-router-dom) decidir o que renderizar.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agressivo para assets com hash no nome (JS/CSS gerados pelo Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
